<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="estilos.css">
>
<body>
    <div class="contenedor">
        <div class="buscador">
            <input type="text" placeholder="Ingresa nombre de la ciudad" spellcheck="false">
            <button><img src="imagenes/buscar.png" alt="Buscar"></button>
        </div>

         <div class="clima-info">
            <img src="imagenes/clima-ejemplo.webp" class="icono-clima" alt="Icono Clima">
            <h1 class="temperatura">22°c</h1>
            <h2 class="ciudad">Huancayo</h2>

            <div class="detalles">
                <div class="columna">
                    <img src="imagenes/humedad.png" alt="Humedad">
                    <div>
                        <p class="humedad">50%</p>
                        <p>Humedad</p>
                    </div>
                </div>
                <div class="columna">
                    <img src="imagenes/viento.png" alt="Viento">
                    <div>
                        <p class="viento">15 km/h</p>
                        <p>Velocidad del Viento</p>
                    </div>
                </div>
            </div>
        </div>


    <!-- Enlace a tu archivo de JavaScript -->
<script src="script.js"></script>
</body>
